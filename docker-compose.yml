services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  user-service:
    build: { context: ., args: { SERVICE: user-service } }
    environment:
      PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8081:8081"]
    depends_on: [postgres]
  customer-service:
    build: { context: ., args: { SERVICE: customer-service } }
    environment:
      PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8082:8082"]
    depends_on: [postgres]
  product-service:
    build: { context: ., args: { SERVICE: product-service } }
    environment:
      PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8083:8083"]
    depends_on: [postgres]
  inventory-service:
    build: { context: ., args: { SERVICE: inventory-service } }
    environment:
      PORT: "8084"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8084:8084"]
    depends_on: [postgres]
  order-service:
    build: { context: ., args: { SERVICE: order-service } }
    environment:
      PORT: "8085"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8085:8085"]
    depends_on: [postgres]
  payment-service:
    build: { context: ., args: { SERVICE: payment-service } }
    environment:
      PORT: "8086"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8086:8086"]
    depends_on: [postgres]
  notification-service:
    build: { context: ., args: { SERVICE: notification-service } }
    environment:
      PORT: "8087"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8087:8087"]
    depends_on: [postgres]
  shipping-service:
    build: { context: ., args: { SERVICE: shipping-service } }
    environment:
      PORT: "8088"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8088:8088"]
    depends_on: [postgres]
  report-service:
    build: { context: ., args: { SERVICE: report-service } }
    environment:
      PORT: "8089"
      DB_URL: jdbc:postgresql://postgres:5432/appdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["8089:8089"]
    depends_on: [postgres]
  api-gateway:
    build: { context: ., args: { SERVICE: api-gateway } }
    environment:
      PORT: "8080"
      USER_URL: http://user-service:8081
      CUSTOMER_URL: http://customer-service:8082
      PRODUCT_URL: http://product-service:8083
      INVENTORY_URL: http://inventory-service:8084
      ORDER_URL: http://order-service:8085
      PAYMENT_URL: http://payment-service:8086
      NOTIFICATION_URL: http://notification-service:8087
      SHIPPING_URL: http://shipping-service:8088
      REPORT_URL: http://report-service:8089
    ports: ["8080:8080"]
