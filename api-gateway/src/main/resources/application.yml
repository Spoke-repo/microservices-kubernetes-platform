server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: customer-service
          uri: ${CUSTOMER_URL:http://localhost:8082}
          predicates:
            - Path=/api/customers/**
        - id: product-service
          uri: ${PRODUCT_URL:http://localhost:8083}
          predicates:
            - Path=/api/products/**
        - id: inventory-service
          uri: ${INVENTORY_URL:http://localhost:8084}
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: ${ORDER_URL:http://localhost:8085}
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: ${PAYMENT_URL:http://localhost:8086}
          predicates:
            - Path=/api/payments/**
        - id: notification-service
          uri: ${NOTIFICATION_URL:http://localhost:8087}
          predicates:
            - Path=/api/notifications/**
        - id: shipping-service
          uri: ${SHIPPING_URL:http://localhost:8088}
          predicates:
            - Path=/api/shipments/**
        - id: report-service
          uri: ${REPORT_URL:http://localhost:8089}
          predicates:
            - Path=/api/reports/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
