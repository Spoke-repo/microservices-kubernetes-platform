name: build-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, user-service, customer-service, product-service, inventory-service, order-service, payment-service, notification-service, shipping-service, report-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build
        run: mvn -B -pl ${{ matrix.service }} -am package -DskipTests
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to AKS
        env:
          SERVICE: ${{ matrix.service }}
          REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
          TAG: ${{ github.sha }}
        run: |
          kubectl create namespace microservices --dry-run=client -o yaml | kubectl apply -f -
          if [ "$SERVICE" = "api-gateway" ]; then
            envsubst '${REGISTRY} ${TAG}' < k8s/gateway.yaml.tpl | kubectl apply -f -
          else
            envsubst '${SERVICE} ${REGISTRY} ${TAG}' < k8s/service.yaml.tpl | kubectl apply -f -
          fi
          kubectl -n microservices rollout status deployment/$SERVICE --timeout=300s
